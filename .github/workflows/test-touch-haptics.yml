name: Test touch haptics

on:
  workflow_dispatch:
  push:
    branches: [touch-haptics]
  pull_request:
    paths:
      - '.github/workflows/test-touch-haptics.yml'
      - 'src/Celeste.Android.Patches/StickHaptics.cs'
      - 'src/Celeste.Android.Patches/TouchControls.cs'
      - 'src/Celeste.Android/**'
      - 'tests/TouchHaptics/**'

permissions:
  contents: read

jobs:
  joystick-transitions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test joystick axes, jitter, fast crossings, and angle wrap
        run: dotnet run --project tests/TouchHaptics -c Release
